<div class="location-form-overlay">
  <div class="location-form-modal">
    <div class="modal-header">
      <h3>{{ isEditMode ? 'Rename Location' : 'Create Location' }}</h3>
      <button type="button" (click)="close()" class="close-btn">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="name">Location Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="form-control"
          placeholder="e.g., Home Office"
          [attr.aria-label]="'Location name'"
          autofocus />
        <div *ngIf="form.get('name')?.touched && form.get('name')?.invalid" class="error-message">
          <p *ngIf="form.get('name')?.errors?.['required']">Location name is required</p>
          <p *ngIf="form.get('name')?.errors?.['minlength']">Location name must not be empty</p>
          <p *ngIf="form.get('name')?.errors?.['maxlength']">Location name must not exceed 255 characters</p>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" (click)="close()" class="btn btn-secondary">Cancel</button>
        <button type="submit" [disabled]="form.invalid || isSubmitting" class="btn btn-primary">
          {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
