<div class="category-list-container">
  <h2>Categories</h2>

  <div *ngIf="loading" class="loading">Loading categories...</div>

  <div *ngIf="error" class="error-message">
    <span>{{ error }}</span>
    <button (click)="closeError()" class="btn-close">×</button>
  </div>

  <div *ngIf="successMessage" class="success-message">
    <span>{{ successMessage }}</span>
    <button (click)="closeSuccess()" class="btn-close">×</button>
  </div>

  <div *ngIf="!loading && categories.length === 0" class="empty-state">
    No categories yet. Create one to get started!
  </div>

  <table *ngIf="!loading && categories.length > 0" class="categories-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Items</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categories" class="category-item">
        <td>{{ category.name }}</td>
        <td>{{ category.itemCount }}</td>
        <td>{{ category.createdAt | date: 'short' }}</td>
        <td>
          <button
            (click)="renameCategory(category.id, category.name)"
            class="btn-rename">
            Rename
          </button>
          <button
            (click)="deleteCategory(category.id, category.name)"
            [disabled]="deleting[category.id]"
            class="btn-delete">
            {{ deleting[category.id] ? 'Deleting...' : 'Delete' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <button (click)="refreshCategories()" class="btn-refresh">Refresh</button>
</div>
