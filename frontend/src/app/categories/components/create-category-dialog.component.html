<div class="dialog-form">
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="categoryName">Category Name</label>
      <input
        id="categoryName"
        [(ngModel)]="categoryName"
        name="categoryName"
        type="text"
        placeholder="Enter category name"
        [disabled]="loading"
        autofocus
      />
    </div>

    <div class="form-actions">
      <button type="button" (click)="onCancel()" [disabled]="loading" class="btn-cancel">
        Cancel
      </button>
      <button type="submit" [disabled]="loading || !categoryName.trim()" class="btn-submit">
        {{ loading ? 'Creating...' : 'Create' }}
      </button>
    </div>
  </form>
</div>
